name: Scoranger
options:
  bundleIdPrefix: com.irllabs
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

packages:
  # local shallow clone (scripts/fetch_python.sh) — verovio's Package.swift uses
  # unsafeFlags, which SPM only allows for local path packages
  Verovio:
    path: Vendor/verovio
  SwiftDraw:
    url: https://github.com/swhitty/SwiftDraw
    from: 0.18.0
  # Firebase, for the OPTIONAL half of the app: an account, and the shared
  # setlists an account makes possible (design/FIREBASE.md).
  #
  # Pinned to a minor floor rather than a range, like the two above. Signed
  # out, none of this runs: `FirebaseApp.configure()` is called at first
  # sign-in and never at launch, which is what makes "no login gates the app"
  # literal instead of approximate (§0.2, §9.1). Linking the SDK is not
  # configuring it.
  Firebase:
    url: https://github.com/firebase/firebase-ios-sdk
    from: 11.9.0
  # Google's own sign-in flow. Firebase Auth takes the credential this hands
  # back; it cannot obtain one itself.
  GoogleSignIn:
    url: https://github.com/google/GoogleSignIn-iOS
    from: 8.0.0

targets:
  Scoranger:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - Scoranger
      # embedded engine: bridge.py + scoranger_engine + pure-Python deps,
      # copied into the bundle as folder references (run scripts/vendor_engine.sh first)
      - path: PythonApp/app
        type: folder
        buildPhase: resources
      - path: PythonApp/app_packages
        type: folder
        buildPhase: resources
      # Every licence text the credits screen offers (Pipeline.Credit.text).
      # Tracked, except Licences/python/, which vendor_engine.sh generates
      # from each Python package's .dist-info. Licences/README.md says where
      # each of the others came from.
      - path: Licences
        type: folder
        buildPhase: resources
      # The General MIDI sound bank the app PLAYS with (scripts/fetch_soundfont.sh).
      # It has to be IN the bundle: iOS ships no GM bank an app may load, and
      # the absolute macOS path this used to read resolved in the simulator
      # only because a simulator process falls through to the host Mac's
      # filesystem. See PlaybackSound.bank.
      - path: Vendor/SoundFonts
        type: folder
        buildPhase: resources
    # Stamp the commit into the built Info.plist, so a tester's report names an
    # exact tree rather than a version that covers several builds. Absent when
    # git is not available, in which case the stamp simply omits it.
    postBuildScripts:
      - name: Stamp the commit
        basedOnDependencyAnalysis: false
        script: |
          SHA=$(git -C "$SRCROOT/.." rev-parse --short HEAD 2>/dev/null || echo "")
          PLIST="$TARGET_BUILD_DIR/$INFOPLIST_PATH"
          if [ -n "$SHA" ] && [ -f "$PLIST" ]; then
            /usr/libexec/PlistBuddy -c "Add :GitSHA string $SHA" "$PLIST" 2>/dev/null \
              || /usr/libexec/PlistBuddy -c "Set :GitSHA $SHA" "$PLIST"
          fi
    dependencies:
      - framework: Vendor/Python.xcframework
        embed: true
        codeSign: true
      - package: Verovio
        product: VerovioToolkit
      - package: SwiftDraw
        product: SwiftDraw
      - package: Firebase
        product: FirebaseAuth
      - package: Firebase
        product: FirebaseFirestore
      - package: Firebase
        product: FirebaseStorage
      # The two writes a client is never allowed to make itself: joining a
      # setlist and removing somebody from one. Both edit the membership map,
      # which the rules refuse to every client (design/FIREBASE.md §4.4).
      - package: Firebase
        product: FirebaseFunctions
      - package: GoogleSignIn
        product: GoogleSignIn
    postBuildScripts:
      - name: Install Python stdlib
        script: |
          set -e
          # Before install_python turns the .so files into frameworks: the
          # privacy manifests OpenSSL's two extension modules need, dropped
          # where utils.sh's own hook will move them in and sign them
          # (ITMS-91061 -- see scripts/seed_privacy_manifests.sh).
          bash "$PROJECT_DIR/scripts/seed_privacy_manifests.sh"
          source "$PROJECT_DIR/Vendor/Python.xcframework/build/utils.sh"
          install_python Vendor/Python.xcframework app app_packages
        basedOnDependencyAnalysis: false
      - name: Bake the Firebase config
        script: |
          # GoogleService-Info.plist is gitignored (design/FIREBASE.md §11.8):
          # it names a specific Firebase project and carries that project's API
          # key, and this repo is public. Copied in at build time, the same
          # posture as the two keys below.
          #
          # The URL SCHEME is NOT injected here. It is in project.yml, because
          # Xcode regenerates the built Info.plist after this phase runs and
          # anything written to it here disappears without an error.
          #
          # No plist is not a failure: a signed-out build is a complete build,
          # and the app must run for somebody who never signs in. SignIn.swift
          # reports the absence rather than trapping.
          CONFIG="$PROJECT_DIR/GoogleService-Info.plist"
          if [ -f "$CONFIG" ]; then
            cp "$CONFIG" "$CODESIGNING_FOLDER_PATH/GoogleService-Info.plist"
          else
            echo "warning: no GoogleService-Info.plist -- signing in is unavailable in this build"
          fi
        basedOnDependencyAnalysis: false
      - name: Bake OMR key
        script: |
          # repo is public: the key lives in the gitignored .omr-api-key,
          # injected into the app bundle at build time (zero-config conversion)
          if [ -f "$PROJECT_DIR/../.omr-api-key" ]; then
            cp "$PROJECT_DIR/../.omr-api-key" "$CODESIGNING_FOLDER_PATH/omr-default-key.txt"
          fi
        basedOnDependencyAnalysis: false
      - name: No OpenRouter key in the bundle
        script: |
          # CHAT BRINGS ITS OWN KEY (0.15.0). Until then this phase baked the
          # developer's OpenRouter key from .env into the bundle ("zero-config
          # chat", 2026-08-16), where anyone who unzipped the .ipa could read it
          # and spend it from anywhere. Ali's decision, 2026-09-23: the reader
          # pastes their own key in Settings, and the app ships none.
          #
          # The phase stays, as a deletion, because an INCREMENTAL build keeps
          # whatever an earlier build left in the app folder -- dropping the
          # bake alone would leave the old key in every development build.
          # deploy_testflight.sh refuses an archive that carries one.
          rm -f "$CODESIGNING_FOLDER_PATH/openrouter-default-key.txt"
        basedOnDependencyAnalysis: false
      - name: Stamp git sha
        script: |
          # Only the sha is baked: the version and build number shown in the UI
          # are read from Info.plist at runtime, so what the app displays is
          # always exactly the CFBundleVersion App Store Connect records.
          # Bump the build number with scripts/bump_build.sh.
          SHA=$(git -C "$PROJECT_DIR/.." rev-parse --short HEAD 2>/dev/null || echo "?")
          printf '%s' "$SHA" > "$CODESIGNING_FOLDER_PATH/build-sha.txt"
        basedOnDependencyAnalysis: false
      - name: Bake UI-test fixtures
        script: |
          # DEBUG ONLY, and that is a copyright requirement rather than a size
          # optimisation. The owner's posture for the 0.7 line, in his words:
          # "ship with NO scores bundled". These fixtures are two editions of
          # "Sous le ciel de Paris" -- a Hubert Giraud composition, one of them
          # an arrangement by Gheorghe Branici -- and shipping them inside the
          # app is distributing copyrighted music to every install, whether or
          # not any screen ever shows them.
          #
          # The comment that used to sit here said "NOT a shipped feature: a
          # fresh install starts with an empty library", and that was true
          # about the LIBRARY and false about the BUNDLE: the files are only
          # seeded under -seedTestLibrary, but the copy ran in every
          # configuration, so Release carried them too. Verified in the
          # shipped artifact -- 0.6.20 build 180's
          # Scoranger.xcarchive/.../Scoranger.app/samples-seed held all four
          # files, 788 KB, including a 666 KB PDF.
          #
          # The gate builds Debug, so the UI tests are unaffected.
          # check_no_bundled_scores.py is the release gate.
          if [ "$CONFIGURATION" != "Debug" ]; then
            echo "note: $CONFIGURATION build -- no score fixtures bundled (copyright)"
            rm -rf "$CODESIGNING_FOLDER_PATH/samples-seed"
          elif [ -d "$PROJECT_DIR/../testdata/app-samples" ]; then
            mkdir -p "$CODESIGNING_FOLDER_PATH/samples-seed"
            cp "$PROJECT_DIR/../testdata/app-samples/"* "$CODESIGNING_FOLDER_PATH/samples-seed/"
          fi
        basedOnDependencyAnalysis: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.irllabs.scoranger
        # Sign in with Apple. Must match the APPLE_ID_AUTH capability on the
        # App ID or the archive will not sign; SignIn.appleIsAvailable reads
        # this back out of the built profile at runtime, so the button
        # enables itself once both halves are in place.
        CODE_SIGN_ENTITLEMENTS: Scoranger/Scoranger.entitlements
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: V9DBGV72NL  # IRL Labs LLC
        # Two numbers, two jobs.
        #
        # CURRENT_PROJECT_VERSION (CFBundleVersion) counts BUILDS: every upload
        # gets the next one, including bug fixes to a feature already shipped.
        # It is the single source of truth for the build number — what App Store
        # Connect records (ExportOptions has manageAppVersionAndBuildNumber=false)
        # and what the app's footer reads back out of Info.plist. Bump it with
        # scripts/bump_build.sh, never by hand.
        #
        # MARKETING_VERSION (CFBundleShortVersionString) names the FEATURE SET:
        # one bump per feature, edited here by hand when that feature starts.
        # Several builds share a version while its bugs get fixed.
        #   0.1.1  penny-whistle diagrams: smaller, above the staff
        #   0.1.2  dragging, repeat signs, two-page view (combined)
        #   0.6.9  the app carries its own General MIDI bank, so playback has
        #          timbres at all on a device
        #   0.6.10 three of Ali's five: the Pencil chip off the bar, the mixer
        #          out of the bezel, and chord-diagrams refusing a staff it
        #          cannot draw on. The other two are 0.6.11.
        #   0.6.11 a + on the score bar that files this arrangement into set
        #          lists. Pagination (#4) is 0.6.12: its scope is unbounded and
        #          it was not going to hold this.
        #   0.6.12 the mixer rebuilt as a window you can pick up
        #          (design/MIXER_WINDOW.md). Pagination moves to 0.6.13.
        #   0.6.13 images (JPG/PNG/HEIC) import as scores, on the PDF's own
        #          path. Pagination moves to 0.6.14.
        #   0.6.20 the 0.6.x work that never reached a build: chord symbols
        #          heard as notes from a names-only staff, two staves of one
        #          name shown as one strip, and the OMR progress fix deployed
        #          at last. Cut from 0.6.19 and NOT from dev, which carries
        #          0.7's sharing work. Shipped as build 180
        #   0.7.0  SHARED SET LISTS. Identity that outlives a title (opaque ids
        #          everywhere, the library named before anyone signs in, a
        #          reader's pencil marks keyed to the score rather than to what
        #          it is called today); share without the cloud, as one
        #          .scorbundle over AirDrop; and then the cloud half -- an
        #          account, a set list several people add to and reorder, and
        #          everybody's markup on it.
        #
        #          Planned as 0.7.0 through 0.7.5 in design/FIREBASE.md §11 and
        #          asked for as one build: "build all of these necessary
        #          features for sharing playlists into the first 7.0 build."
        #          §11.9 records the difference, including what was left out.
        #   0.18.1 THE APP STORE SUBMISSION BUILD: THREE FIXES FOUND TAKING
        #          THE STORE SCREENSHOTS (2026-10-04). Fixes only, so the
        #          patch bumps. Written once both were found and before the gate,
        #          and said so: the submission is the reason for the build,
        #          and Echo, on a child account with no TestFlight, can only
        #          get the shared set list fix from the App Store.
        #
        #          In this build:
        #            1. On an iPhone the transport's play/stop button is on
        #               screen. The tray's one line was wider than a phone
        #               whenever a score had several parts (a knob each), or
        #               while playing (a clock and a scrubber), and centred
        #               it pushed play off the LEFT edge: on a 6.5" iPhone a
        #               quartet could not be played, and a tune could be
        #               started and not stopped. A line that does not fit now
        #               scrolls sideways with play first, as it already did
        #               at accessibility text sizes, and a phone leaves out
        #               the clock and scrubber (its position bar is above).
        #            2. "OMR DRAFT" marks a scan's transcription, not every
        #               import. The rule was "one version, the import",
        #               the desktop route's shape: in the app it labelled
        #               every MusicXML, ABC and MIDI tune a scan and never
        #               labelled a real one, which arrives as the page and
        #               then an `omr` version.
        #            3. On an iPhone a shared set list's row keeps its Play
        #               button on screen: 0.18.0's Sync button was a fourth
        #               control the row had no room for. On a phone Sync is
        #               in the row's ☰ actions; on an iPad it stays beside
        #               share, and is in the ☰ actions there too.
        #          NOT in this build, and said before it starts:
        #            - chord diagrams on two chords a bar or so apart overlap
        #              (BACKLOG);
        #            - the engine's PDF export draws the tempo mark's note
        #              as a box; the app's own engraving is correct
        #              (BACKLOG);
        #            - NO OTHER CHANGE.
        #   0.18.0 SHARED SET LISTS KEEP IN STEP, AND FIXES COLLECTED AFTER
        #          0.17.0 (opened 2026-10-03 as 0.17.1). Scope written as each
        #          item is taken on, before its work. Opened as a patch; item
        #          2 is a feature, so the build is 0.18.0 (a build carrying a
        #          fix and a feature is a feature build). Ali: "Get this into
        #          the build after the one that's going through right now ...
        #          build the backlog, resolve it, and save it for the next
        #          release."
        #
        #          In this build:
        #            1. The tray's tempo knob turns DOWN again. It sits on the
        #               bottom edge and turned only by vertical drag, down for
        #               slower, so there was ~40pt (6 bpm) of room to turn it
        #               down and the whole screen to turn it up: Ali took it
        #               from 120 to 186 and could not bring it back, by finger
        #               or pointer. It now reads both axes -- up or right is
        #               faster, down or left slower -- and its drag start is
        #               gesture state, so a cancelled drag leaves nothing stale.
        #            2. A shared set list keeps in step on every member's
        #               device. Ali added a tune to "Echo and Bubba" on his
        #               iPad and it never reached Echo: the row was filled
        #               from the server once, at join, and adding to it from
        #               the library pushed nothing. Now an arrangement added,
        #               removed or moved on a shared row goes up, and what
        #               other members did comes down -- on launch, on return
        #               to the app, while the app is open, and from a Sync
        #               button on the row, beside the share button, which
        #               also shows whether the list is in step. An adopted
        #               copy remembers which shared entry it is, in the
        #               library, so a second device of the same account does
        #               not import it twice.
        #          NOT in this build, and said before it starts:
        #            - no trackpad or mouse-wheel scrolling on the knob;
        #            - a shared entry is still a COPY pinned at the version
        #              it was added at: a later edit to the arrangement does
        #              not reach the band (repinning is its own feature);
        #            - two members moving the same tune at once: the later
        #              move wins, as it does on the shared screen today;
        #            - no sync while the app is closed (no push
        #              notifications or background refresh);
        #            - a shared row's title is one button (44pt) narrower,
        #              for the Sync button;
        #            - if two of one account's devices adopt the same new
        #              entry before library sync tells either about the
        #              other, the second copy leaves the row but stays in
        #              that library;
        #            - NO OTHER CHANGE. Closed 2026-10-03 for the gate.
        #   0.17.0 MEASURE NUMBERS, AND A LINE THAT ENDS WHERE YOU SAY
        #          (2026-10-03). Scope written before the work. Two features
        #          and one fix, so the minor bumps once. Ali, on Molly Ban:
        #          "I want measure # control" -- the chat answered that there
        #          was no setting, which was true.
        #
        #          In this build:
        #            1. Measure numbers from chat: on every bar, every Nth bar
        #               ("every third"), at the start of each line (the
        #               engraver's default), or none. Stored in the notation so
        #               it versions and travels; both renderers draw it.
        #            2. "End the line at bar X": bar X closes its line and the
        #               bars after it move on, with the lines before it evened
        #               out rather than one short line left behind.
        #            3. A score nobody has paginated is no longer refused a
        #               line length: one is chosen from how busy its bars are,
        #               preferring 4 or 8 so phrases line up, and the report
        #               says what was chosen.
        #            4. Fix: a part with no name could not be addressed by the
        #               name the error itself offered ("No part matches 'Part'.
        #               Available parts: ['Part']").
        #            5. Fix, found while building this: a paginated score
        #               longer than one page was drawn as ONE page running off
        #               its foot, since 0.13.0 -- Verovio's `encoded` breaks
        #               pages only where the notation says, and pagination
        #               writes none. Both renderers now ask for `line`: the
        #               reader's lines, Verovio's page turns. Added to the
        #               scope after it started, and said so here.
        #          Added by Ali while the build was under way (2026-10-03),
        #          and said so here:
        #            6. Print: a button on the score's bar (in More where the
        #               bar has no room) opens the system print sheet with the
        #               engraved pages, in single- and two-page view; never on
        #               the strip.
        #            7. The chat box keeps one shape when stretched taller:
        #               its fill was a rectangle under a pill-shaped outline.
        #            8. Chords start at the first bar: an ABC tune with no
        #               pickup numbered its first full bar 0, so "bar 1" was
        #               the page's second. New imports number from 1, and an
        #               arrangement already numbered from 0 gets one new
        #               version numbered from 1 at launch.
        #            9. A chord is always a chord symbol: set_chords takes an
        #               offset for a change mid-bar ("Em in the second half of
        #               bar 8"), and a chord name as a text mark -- engraved
        #               lower and in italics -- is refused.
        #          NOT in this build, and said before it starts:
        #            - no control over where a measure number sits or its
        #              size; Verovio places it;
        #            - the chosen line length is an estimate from note counts,
        #              not a measurement of the engraved page;
        #            - Pencil markup does not print: ink is kept in the
        #              coordinates of the page as drawn, not the PDF's;
        #            - chords already written as text marks stay text marks
        #              until the reader asks for them to be replaced;
        #            - NO OTHER CHANGE.
        #   0.16.0 YOUR LIBRARY ON EVERY DEVICE YOU SIGN IN ON (2026-09-26).
        #          Scope written before the work. One feature, so the minor
        #          bumps. Ali: "if i signin as google on my ipad ... when i
        #          sign in with google on my iphone, I expect to see all the
        #          same pieces/setlists/books. Same with apple sign in."
        #
        #          In this build:
        #            1. Signed in (Google or Apple), the library is the
        #               account's: arrangements with their whole version
        #               history and sources, pieces, set lists and books, on
        #               every device signed in to that account. The first
        #               device's library becomes the account's; a device that
        #               already has a library of its own MERGES it in (Ali's
        #               decision), so nothing on either device is lost.
        #            2. Changes go both ways while online, within about a
        #               minute and at once on returning to the app; work done
        #               offline waits and goes when there is a connection. A
        #               delete stays deleted: a device that was offline cannot
        #               bring it back.
        #            3. Books sync like everything else. On cellular the app
        #               asks first -- download now, or wait for Wi-Fi -- the
        #               way Apple's own apps do (Ali's decision).
        #            4. Settings › Account says where sync is: synced, how
        #               many changes are waiting, or what failed.
        #            5. The privacy policy says what is stored for a
        #               signed-in account, and that deleting the account
        #               deletes it.
        #          NOT in this build, and said before it starts:
        #            - Pencil markup does not sync yet; it stays on the device
        #              it was drawn on;
        #            - the same document edited on two devices while BOTH were
        #              offline keeps one device's whole edit, not a merge of
        #              the two field by field (design/FIREBASE.md §7 rule 3);
        #              two arrangements' version histories never conflict;
        #            - no "two libraries" screen (FIREBASE.md §9.3): a second
        #              device merges;
        #            - every version is downloaded, not only the latest: no
        #              holding policy or eviction (§5.1, §5.4);
        #            - signing out keeps the library on the device and stops
        #              syncing; it does not remove anything;
        #            - no App Check on Firestore or Storage;
        #            - NO OTHER CHANGE.
        #   0.15.0 CHAT BRINGS ITS OWN KEY, AND EVERY LICENCE TRAVELS WITH THE
        #          APP (2026-09-23). Scope written before the gate. One feature
        #          and two fixes, so the minor bumps once. 0.14.1 was scoped
        #          and never shipped; its one fix rides here.
        #
        #          In this build:
        #            1. The app ships NO OpenRouter key. Chat uses the key the
        #               reader pastes in Settings › Engine and is billed to
        #               their own account (Ali's decision). Through 0.14.0 the
        #               developer's key was baked into every build and a 401
        #               "self-heal" wrote it into readers' Keychains; a device
        #               forgets that key at launch (RetiredKeys, by hash), and
        #               the deploy refuses an archive carrying any key.
        #            2. Every licence text the credits name ships in the app
        #               and opens from Settings › How Scoranger works › Read
        #               the licence: the Python packages (vendor_engine.sh
        #               deleted them with the .dist-info), CPython and the C
        #               libraries in its build, Verovio and what is compiled
        #               into it, the music fonts, SwiftDraw, Firebase and
        #               Google. The deploy refuses an archive missing one.
        #               Credits corrected from the build products: SwiftProtobuf
        #               out (links into nothing), AppCheckCore and
        #               RecaptchaInterop in (they link).
        #            3. Verovio's data/Liberation.css no longer ships. It is
        #               Liberation Serif 1.04, GPLv2 rather than OFL, and the
        #               app never loads it (Ali's decision).
        #            4. The 0.14.1 fix: every incoming file (share-in, book,
        #               PDF, score, bundle) is copied off the main thread.
        #          NOT in this build, and said before it starts:
        #            - no key gateway: the OMR key is still built in, capped
        #              at one Cloud Run instance (BACKLOG, the baked keys);
        #            - no reviewer key: App Review needs one in the review
        #              notes, and that is Ali's to supply at submission;
        #            - the privacy policy's 0.15.0 wording is published only
        #              once this build is on TestFlight;
        #            - NO OTHER CHANGE.
        #   0.14.0 A BOOK COMES IN AS A BOOK, AND COMES APART INTO ITS TUNES
        #          (2026-09-22). Scope written before the work. One feature
        #          and one fix it depends on, so the minor bumps once.
        #
        #          In this build:
        #            1. IMPORT AS... Anything shared into the app (share sheet,
        #               Open in, AirDrop) first asks what it is: a NEW PIECE
        #               (today's behaviour -- a piece named after it, matched
        #               by name before one is created), a NEW ARRANGEMENT IN AN
        #               EXISTING PIECE (picked from the library), or a NEW BOOK
        #               (PDFs only). Until now a shared PDF could only become a
        #               scan arrangement, so a book could not be shared in at
        #               all. A .scorbundle keeps its own offer screen;
        #            2. AUTO-SPLIT. `book-detect` proposes where each tune
        #               starts and what it is called, from the strongest
        #               evidence the book has: its bookmarks, then the heading
        #               on its text layer, then -- for a scan -- lines the app
        #               reads with Apple Vision on the device. A page with no
        #               heading continues the tune before it; a contents or
        #               index page belongs to no tune. The book opens on the
        #               proposal after import and NOTHING is written until the
        #               reader confirms it, one of two ways:
        #                 a. KEEP IT A BOOK. The list is saved as the book's
        #                    CONTENTS (`book-contents`), and the book is read
        #                    the way a set list is: its tunes listed, one
        #                    opened, the next and previous a tap away -- each
        #                    showing its own pages rather than a scroll
        #                    through the whole PDF. No arrangement and no
        #                    piece is made; the book stays one book. Entries
        #                    are renamed, re-ranged, added and removed on the
        #                    same list;
        #                 b. TAKE THE TUNES OUT. `book-split` makes each an
        #                    arrangement under a piece named after its title,
        #                    joining a piece of that name that already exists;
        #            3. and A TUNE TAKEN OUT OF A BOOK CARRIED THE WHOLE BOOK.
        #               extract_from_book copied the page's resource
        #               dictionary as it stood, and a jsPDF book hangs all 689
        #               of its images off every page: one page of the Comhaltas
        #               San Diego tunebook came out 28 MB -- and its "<<" and
        #               ">>" links, copied with the page, dragged every other
        #               page in behind them. Images the page never draws and
        #               links to pages it no longer has are dropped: 176 KB,
        #               same content stream, same image bytes.
        #          And from the release merge (rel/0.13.0 into this, written
        #          when the merge was made, not before the work):
        #            4. THE ROTATED OMR KEY. The service's key moved into
        #               Secret Manager and the old one was retired on
